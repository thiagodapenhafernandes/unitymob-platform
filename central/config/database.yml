default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>
development:
  <<: *default
  database: unitymob_central_development
test:
  <<: *default
  database: <%= ENV.fetch("CENTRAL_TEST_DB", "unitymob_central_test") %>
production:
  <<: *default
  database: <%= ENV.fetch("CENTRAL_DB_NAME", "unitymob_central_production") %>
