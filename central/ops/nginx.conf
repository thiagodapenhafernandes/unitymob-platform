# Instalar após emitir o certificado TLS para este domínio.
server {
  listen 80;
  server_name admin.unitymob.com.br;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl;
  server_name admin.unitymob.com.br;
  ssl_certificate /etc/letsencrypt/live/admin.unitymob.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.unitymob.com.br/privkey.pem;
  client_max_body_size 72m;
  root /home/unitymob/central/current/central/public;
  location /assets/ { expires 1y; add_header Cache-Control public; try_files $uri =404; }
  location / {
    proxy_pass http://127.0.0.1:4020;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }
}
