<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="980" viewBox="0 0 1820 980" role="img" aria-labelledby="title desc"><title id="title">Unitymob — comunicação entre extensão, Gateway e CRMs</title><desc id="desc">Gateway confirma e-mail e localiza contas. O login e os dados ficam nos CRMs. A Central permanece fora do login.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#aab4c2"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="#7cbbf3"/></marker></defs><rect width="1820" height="980" fill="#191919"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#eceff3} .muted{fill:#aeb8c4} .line{fill:none;stroke:#aab4c2;stroke-width:2;marker-end:url(#arrow)} .blue{stroke:#7cbbf3;marker-end:url(#blue)}</style><text x="52" y="55" font-size="30" text-anchor="start">Unitymob · arquitetura de comunicação</text><text x="52" y="89" font-size="17" text-anchor="start" style="fill:#aeb8c4">Implementação local • Discovery V2 • ativação coordenada em produção ainda necessária</text><rect x="65" y="165" width="280" height="118" rx="13" fill="#303235" stroke="#515860" stroke-width="1.5"/><text x="205.0" y="197" font-size="21" text-anchor="middle">Aplicativo mobile</text><text x="205.0" y="225" font-size="16" text-anchor="middle" style="fill:#c0c7d0">V2: e-mail → código → conta</text><text x="205.0" y="249" font-size="16" text-anchor="middle" style="fill:#c0c7d0">V1 preservado na transição</text><rect x="650" y="150" width="370" height="150" rx="13" fill="#303235" stroke="#6388ac" stroke-width="1.5"/><text x="835.0" y="182" font-size="21" text-anchor="middle">Gateway Unitymob</text><text x="835.0" y="210" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Confirma o e-mail por código</text><text x="835.0" y="234" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Localiza os vínculos ativos</text><text x="835.0" y="258" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Instância + conta + usuário</text><rect x="1300" y="165" width="350" height="118" rx="13" fill="#303235" stroke="#515860" stroke-width="1.5"/><text x="1475.0" y="197" font-size="21" text-anchor="middle">Serviço de e-mail</text><text x="1475.0" y="225" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Resend · HTTPS / 443</text><text x="1475.0" y="249" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Entrega o código ao usuário</text><path d="M345 220 H650" class="line blue" marker-start="url(#blue)"/><text x="497" y="205" font-size="16" text-anchor="middle" style="fill:#9ec9f1">1 · descobrir / confirmar / escolher</text><path d="M1020 220 H1300" class="line blue"/><text x="1160" y="205" font-size="16" text-anchor="middle" style="fill:#9ec9f1">Enviar código de confirmação</text><text x="665" y="331" font-size="17" text-anchor="start" style="fill:#9ec9f1">Nenhuma senha de CRM passa pelo Gateway.</text><rect x="65" y="465" width="220" height="100" rx="13" fill="#303235" stroke="#515860" stroke-width="1.5"/><text x="175.0" y="497" font-size="21" text-anchor="middle">WhatsApp Web</text><text x="175.0" y="525" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Conversa individual</text><rect x="345" y="465" width="280" height="100" rx="13" fill="#303235" stroke="#515860" stroke-width="1.5"/><text x="485.0" y="497" font-size="21" text-anchor="middle">Adaptador WA-JS</text><text x="485.0" y="525" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Contexto da página (MAIN)</text><text x="485.0" y="549" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Nome, telefone e identidade</text><rect x="705" y="465" width="300" height="100" rx="13" fill="#303235" stroke="#6388ac" stroke-width="1.5"/><text x="855.0" y="497" font-size="21" text-anchor="middle">Service worker</text><text x="855.0" y="525" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Valida origem, conta e sessão</text><text x="855.0" y="549" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Controla as chamadas HTTPS</text><rect x="705" y="650" width="300" height="100" rx="13" fill="#303235" stroke="#515860" stroke-width="1.5"/><text x="855.0" y="682" font-size="21" text-anchor="middle">Painel nativo Chrome</text><text x="855.0" y="710" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Exibe e confirma as ações</text><text x="855.0" y="734" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Uma conta ativa por vez</text><rect x="1110" y="435" width="290" height="160" rx="13" fill="#303235" stroke="#6388ac" stroke-width="1.5"/><text x="1255.0" y="467" font-size="21" text-anchor="middle">CRM selecionado</text><text x="1255.0" y="495" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Login + segundo fator</text><text x="1255.0" y="519" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Código de uso único → sessão</text><text x="1255.0" y="543" font-size="16" text-anchor="middle" style="fill:#c0c7d0">API com escopo por conta</text><rect x="1510" y="370" width="245" height="118" rx="13" fill="#303235" stroke="#515860" stroke-width="1.5"/><text x="1632.5" y="402" font-size="21" text-anchor="middle">CRM Salute</text><text x="1632.5" y="430" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Leads, imóveis, notas, tarefas</text><text x="1632.5" y="454" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Banco / permissões próprios</text><rect x="1510" y="560" width="245" height="118" rx="13" fill="#303235" stroke="#515860" stroke-width="1.5"/><text x="1632.5" y="592" font-size="21" text-anchor="middle">CRM Conexão</text><text x="1632.5" y="620" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Leads, imóveis, notas, tarefas</text><text x="1632.5" y="644" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Banco / permissões próprios</text><path d="M285 515 H345" class="line"/><path d="M625 515 H705" class="line" marker-start="url(#arrow)"/><text x="645" y="451" font-size="14" text-anchor="middle" style="fill:#c2c9d2">chrome.scripting</text><path d="M855 300 V465" class="line blue" marker-start="url(#blue)"/><text x="965" y="390" font-size="16" text-anchor="middle" style="fill:#9ec9f1">1 · descoberta HTTPS</text><path d="M855 650 V565" class="line" marker-start="url(#arrow)"/><text x="737" y="619" font-size="16" text-anchor="middle" style="fill:#c2c9d2">Comandos / resultados</text><path d="M1005 515 H1110" class="line blue" marker-start="url(#blue)"/><text x="1055" y="423" font-size="16" text-anchor="middle" style="fill:#9ec9f1">2 · login</text><text x="1240" y="700" font-size="17" text-anchor="middle" style="fill:#9ec9f1">3 · atendimento direto por HTTPS</text><path d="M1400 480 H1450 V429 H1510" class="line" marker-start="url(#arrow)"/><path d="M1400 550 H1450 V619 H1510" class="line" marker-start="url(#arrow)"/><path d="M1632 370 V345 H1135 V290 H1020" class="line blue"/><text x="1400" y="327" font-size="16" text-anchor="middle" style="fill:#9ec9f1">4 · vínculos: identidade estável + token exclusivo da instância</text><path d="M1755 619 H1785 V345 H1632" class="line blue"/><path d="M65 255 H30 V770 H1255 V595" class="line" stroke-dasharray="7 6"/><text x="365" y="753" font-size="16" text-anchor="middle" style="fill:#c2c9d2">Mobile V2 · navega ao login web</text><rect x="1100" y="790" width="420" height="110" rx="13" fill="#303235" stroke="#515860" stroke-width="1.5"/><text x="1310.0" y="822" font-size="21" text-anchor="middle">Central de atendimento</text><text x="1310.0" y="850" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Suporte e operação existentes</text><text x="1310.0" y="874" font-size="16" text-anchor="middle" style="fill:#c0c7d0">Não autentica o corretor para a extensão</text><path d="M1400 580 H1470 V790" class="line" marker-start="url(#arrow)" stroke-dasharray="7 6"/><text x="1590" y="748" font-size="16" text-anchor="middle" style="fill:#c2c9d2">Integração de suporte existente</text><text x="52" y="838" font-size="19" text-anchor="start">Limites de confiança</text><text x="52" y="873" font-size="17" text-anchor="start" style="fill:#aeb8c4">Gateway: descobre destinos aprovados. CRM: autentica e autoriza.</text><text x="52" y="905" font-size="17" text-anchor="start" style="fill:#aeb8c4">A sessão da extensão é local ao dispositivo, revogável e expira em até 8 horas.</text><text x="52" y="940" font-size="16" text-anchor="start" style="fill:#aeb8c4">Webhooks Meta continuam em rotas independentes; não intermediam o atendimento da extensão.</text></svg>