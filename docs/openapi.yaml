---
openapi: 3.0.3
info:
  title: Unitymob API
  version: 1.3.0
  description: |
    Referência para integrações externas com a Unitymob.

    ## Autenticação

    Use `Authorization: Bearer <TOKEN_DA_INTEGRACAO>` no backend do sistema de origem. A credencial identifica a conta de destino e é emitida pela operação da Unitymob.

    ## Captação de imóveis

    Envie a captação quando o cadastro estiver pronto. O protocolo confirma a entrada na fila administrativa. A publicação depende da revisão.

    ## Reenvios

    Em caso de timeout, repita o mesmo JSON com o mesmo `external_id`. Alterações no conteúdo de um ID já recebido retornam `409`.
servers:
- url: "/"
  description: Ambiente atual
tags:
- name: Captações
  description: Recebimento de imóveis para revisão administrativa.
paths:
  "/api/v1/property_intakes":
    post:
      operationId: enviarCaptacao
      tags:
      - Captações
      summary: Enviar captação de imóvel
      description: Envie os valores em centavos. Inclua ao menos um contato do proprietário.
        Links temporários das fotos precisam estar válidos até o primeiro recebimento
        bem-sucedido.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Captacao"
            example:
              external_id: CAP-2026-000123
              captured_at: '2026-11-06T14:30:00-03:00'
              captador:
                external_id: CAPTADOR-002
                nome: Mariana Exemplo
              imovel:
                categoria: apartamento
                modalidade: venda
                titulo: Apartamento de 3 quartos com varanda
                descricao: Apartamento com varanda, uma suíte e duas vagas.
                valor_venda_centavos: 85000000
                valor_condominio_centavos: 95000
                valor_iptu_anual_centavos: 180000
                area_privativa_m2: 92.5
                quartos: 3
                suites: 1
                banheiros: 2
                vagas: 2
                endereco:
                  cep: 90000-000
                  logradouro: Rua Exemplo
                  numero: '120'
                  complemento: Apartamento 302
                  bairro: Centro
                  cidade: Porto Alegre
                  uf: RS
                fotos:
                - url: https://midia.example.com/captacoes/sala.jpg
                  ordem: 1
              proprietario:
                nome: Carlos Exemplo
                telefone: "+5551999990000"
                email: carlos@example.com
      responses:
        '200':
          description: Reenvio do mesmo conteúdo. Retorna o protocolo original.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReciboCaptacao"
              example:
                protocolo: PC-000123
                external_id: CAP-2026-000123
                status: pendente_revisao
        '201':
          description: Captação recebida para revisão administrativa.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReciboCaptacao"
              example:
                protocolo: PC-000123
                external_id: CAP-2026-000123
                status: pendente_revisao
        '400':
          description: JSON malformado.
        '401':
          description: Credencial ausente, inválida ou revogada.
        '409':
          description: O ID já foi recebido com conteúdo diferente.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Erro"
              example:
                error: external_id já recebido com dados diferentes
        '413':
          description: O corpo excede 128 KiB.
        '415':
          description: Envie Content-Type application/json.
        '422':
          description: Dados inválidos ou foto indisponível.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Erro"
              example:
                error: Informe o valor da negociação
        '429':
          description: Limite de requisições atingido.
  "/api/v1/property_features":
    get:
      operationId: consultarCaracteristicasDoImovel
      tags:
      - Captações
      summary: Consultar características internas e infraestrutura/lazer da conta
      description: Sem categoria, retorna somente as opções cadastradas na conta,
        preservando o comportamento anterior. Informe categoria para consultar o mesmo
        checklist do cadastro no CRM, incluindo opções padrão residenciais, comerciais,
        industriais e de terrenos e opções personalizadas da conta. Por exemplo,
        categoria=galpao, categoria=sala_comercial ou categoria=terreno. Não altera o banco.
        Opções cadastradas retornam seu ID real; opções padrão sem cadastro retornam
        id=null e devem ser enviadas pelo nome na captação da mesma categoria. As listas
        são ordenadas por nome. IDs pertencem à conta e ao tipo de lista, permanecendo
        iguais após renomeação. Consulte novamente após alterações no Gerenciar.
        Use somente no backend.
      security:
      - BearerAuth: []
      parameters:
      - in: query
        name: categoria
        required: false
        description: Categoria do imóvel, usando os mesmos valores aceitos em imovel.categoria
          na captação. Omitir consulta somente o catálogo cadastrado da conta.
        schema:
          "$ref": "#/components/schemas/Imovel/properties/categoria"
      responses:
        '200':
          description: Catálogo atual da conta, sem dados de outras contas.
          content:
            application/json:
              schema:
                type: object
                required: [caracteristicas_internas, infraestrutura_lazer]
                properties:
                  caracteristicas_internas:
                    type: array
                    items:
                      "$ref": "#/components/schemas/OpcaoCaracteristica"
                  infraestrutura_lazer:
                    type: array
                    items:
                      "$ref": "#/components/schemas/OpcaoCaracteristica"
              example:
                caracteristicas_internas:
                - id: 101
                  nome: Área de serviço
                infraestrutura_lazer:
                - id: 202
                  nome: Piscina
        '401':
          description: Credencial ausente, inválida, revogada ou de conta inativa.
        '422':
          description: Categoria vazia, desconhecida ou com formato inválido.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Erro"
  "/api/v1/properties/search":
    get:
      operationId: consultarImoveisPorEndereco
      tags:
      - Captações
      summary: Consultar possíveis duplicados na mesma conta
      description: Informe número e CEP, ou número, logradouro, cidade e UF. Comparação
        exata, sem diferenciar maiúsculas e acentos; CEP aceita hífen. Complemento
        e torre são opcionais; complemento vazio procura unidades sem complemento.
        Inclui imóveis ativos, inativos e em revisão; retorna até 50 resultados ordenados
        por ID. Se atingir o limite, refine os filtros. Use somente no backend.
      security:
      - BearerAuth: []
      parameters:
      - name: cep
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
      - name: logradouro
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
      - name: numero
        in: query
        required: true
        schema:
          type: string
          maxLength: 255
      - name: complemento
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
      - name: cidade
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
      - name: uf
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
      - name: torre
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
      responses:
        '200':
          description: Possíveis duplicados; lista vazia quando não há correspondência.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imoveis:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      properties:
                        codigo:
                          type: string
                        endereco:
                          "$ref": "#/components/schemas/Endereco"
                        torre:
                          type: string
                          nullable: true
                        categoria:
                          type: string
                        modalidade:
                          type: string
                        status:
                          type: string
                          enum:
                          - ativo
                          - inativo
                          - em_revisao
        '401':
          description: Credencial ausente, inválida ou revogada.
        '422':
          description: Filtros inválidos ou insuficientes.
        '429':
          description: Limite de requisições atingido.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token de integração da conta.
  schemas:
    Captacao:
      type: object
      required:
      - external_id
      - captured_at
      - captador
      - imovel
      - proprietario
      properties:
        external_id:
          type: string
          description: Identificador único da captação no sistema de origem.
        captured_at:
          type: string
          format: date-time
        captador:
          "$ref": "#/components/schemas/Captador"
        imovel:
          "$ref": "#/components/schemas/Imovel"
        proprietario:
          "$ref": "#/components/schemas/Proprietario"
        documentos:
          type: array
          maxItems: 10
          items:
            "$ref": "#/components/schemas/Documento"
          description: Documentos internos PDF, JPEG, PNG ou WebP, até 8 MB cada.
            HTTPS público na porta 443, sem redirecionamento. Autorização vai para
            autorizações de venda; documento vai para documentos internos. Nunca vira
            foto.
    Captador:
      type: object
      required:
      - external_id
      - nome
      properties:
        external_id:
          type: string
        nome:
          type: string
        email:
          type: string
          format: email
          description: Opcional. Vincula o Captador a um usuário ativo da mesma conta;
            e-mail sem correspondência retorna 422.
    OpcaoCaracteristica:
      type: object
      required: [id, nome]
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: ID real da opção nesta conta e tipo de lista. Null identifica
            uma opção padrão sem cadastro; nesse caso, envie nome na captação.
        nome:
          type: string
    ListaCaracteristicas:
      type: array
      description: Opcional. Aceita IDs inteiros, strings numéricas ou nomes do catálogo
        GET /api/v1/property_features, inclusive misturados. Nomes ignoram maiúsculas
        e acentos; guarda o nome atual e elimina repetições. Prefira IDs para suportar
        renomeações nas opções cadastradas. Para opções padrão com id=null, envie o nome
        retornado pela consulta com a mesma categoria do imóvel. Array vazio é válido;
        null, itens inválidos e opções desconhecidas,
        removidas, de outra conta ou categoria retornam 422 sem criar a captação.
        Não cria opções. Omitir mantém a compatibilidade com integrações anteriores.
      items:
        oneOf:
        - type: integer
          format: int64
          minimum: 1
        - type: string
          minLength: 1
          maxLength: 255
          description: Nome com até 255 bytes ou ID em string numérica.
    Imovel:
      type: object
      required:
      - categoria
      - modalidade
      - endereco
      properties:
        categoria:
          type: string
          example: apartamento
          description: Aceita os valores listados, seus equivalentes com hífen ou
            os nomes acentuados do cadastro.
          enum:
          - apartamento
          - cobertura
          - loft
          - casa
          - casa_em_condominio
          - sobrado
          - chacara
          - sitio
          - diferenciado
          - casa_comercial
          - condominio_industrial
          - galpao
          - galpao_em_condominio
          - loja
          - ponto_comercial
          - predio_comercial
          - sala_comercial
          - area
          - terreno
          - terreno_em_condominio
          - condominio
          - empreendimento
        modalidade:
          type: string
          enum:
          - venda
          - locacao
        titulo:
          type: string
        descricao:
          type: string
        endereco:
          "$ref": "#/components/schemas/Endereco"
        caracteristicas_internas:
          "$ref": "#/components/schemas/ListaCaracteristicas"
        infraestrutura_lazer:
          "$ref": "#/components/schemas/ListaCaracteristicas"
        fotos:
          type: array
          maxItems: 10
          items:
            "$ref": "#/components/schemas/Foto"
          description: JPEG, PNG ou WebP, até 8 MB cada. Use HTTPS na porta 443, sem
            redirecionamento.
        area_privativa_m2:
          type: number
          minimum: 0
        valor_venda_centavos:
          type: integer
          minimum: 0
          format: int64
          description: Obrigatório para venda.
        valor_locacao_centavos:
          type: integer
          minimum: 0
          format: int64
          description: Valor mensal obrigatório para locação.
        valor_condominio_centavos:
          type: integer
          minimum: 0
          format: int64
        valor_iptu_anual_centavos:
          type: integer
          minimum: 0
          format: int64
        quartos:
          type: integer
          minimum: 0
        suites:
          type: integer
          minimum: 0
        banheiros:
          type: integer
          minimum: 0
        vagas:
          type: integer
          minimum: 0
        torre:
          type: string
        nome_condominio:
          type: string
        tipo_vaga:
          type: string
        box:
          type: string
        observacoes_chaves:
          type: string
        observacoes_internas:
          type: string
        observacoes_restritas:
          type: string
        onde_estao_as_chaves:
          type: string
          enum:
          - Imobiliária
          - Corretor(a)
          - Proprietário
          - Zelador
          - Portaria
          - Inquilino
          - Construtora
          - Outro
        tipo_cadastro:
          type: string
          enum:
          - Unitário
          - Empreendimento
        area_total_m2:
          type: number
          minimum: 0
          maximum: 99999999.99
        demi_suites:
          type: integer
          minimum: 0
        permuta:
          type: boolean
        parcelamento:
          type: boolean
        administracao_locacao:
          type: boolean
    Endereco:
      type: object
      required:
      - cep
      - logradouro
      - numero
      - bairro
      - cidade
      - uf
      properties:
        cep:
          type: string
        tipo_logradouro:
          type: string
          minLength: 1
          maxLength: 255
          example: Avenida
          description: Opcional, não vazio, até 255 bytes. Gravado em tipo_endereco.
            Quando informado, envie logradouro somente com o nome da via. Não remove
            prefixos automaticamente; envios antigos sem este campo continuam aceitos.
        logradouro:
          type: string
          description: Nome da via; envie sem o tipo quando tipo_logradouro for informado.
        numero:
          type: string
        complemento:
          type: string
        bairro:
          type: string
        cidade:
          type: string
        uf:
          type: string
    Foto:
      type: object
      required:
      - url
      - ordem
      properties:
        url:
          type: string
          format: uri
        ordem:
          type: integer
          minimum: 1
    Proprietario:
      type: object
      required:
      - nome
      properties:
        nome:
          type: string
        telefone:
          type: string
        email:
          type: string
      anyOf:
      - required:
        - telefone
      - required:
        - email
    ReciboCaptacao:
      type: object
      required:
      - protocolo
      - external_id
      - status
      properties:
        protocolo:
          type: string
        external_id:
          type: string
        status:
          type: string
          enum:
          - pendente_revisao
    Erro:
      type: object
      required:
      - error
      properties:
        error:
          type: string
        fields:
          type: array
          items:
            type: string
    Documento:
      type: object
      required:
      - url
      - tipo
      properties:
        url:
          type: string
          format: uri
        tipo:
          type: string
          enum:
          - autorizacao
          - documento
