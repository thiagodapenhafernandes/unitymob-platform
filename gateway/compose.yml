services:
  whatsapp-gateway:
    build: .
    container_name: unitymob-whatsapp-gateway
    env_file:
      - .env
    network_mode: host
    restart: unless-stopped
  webhook-delivery:
    build: .
    profiles: [async-delivery]
    command: [bundle, exec, rake, 'webhooks:work']
    env_file:
      - .env
    network_mode: host
    restart: unless-stopped
